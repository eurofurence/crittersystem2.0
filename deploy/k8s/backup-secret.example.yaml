# Template only - DO NOT commit real secrets.
#
# The database-backup destination is a SEPARATE credential group from the app's
# storage (critter-secrets). Keep it that way on purpose:
#   - a DIFFERENT bucket from EXPORT_STORAGE_DSN / UPLOAD_STORAGE_DSN, so a leak
#     of the app's storage keys cannot reach the backups, and vice versa;
#   - a WRITE/LIST/DELETE-only policy scoped to this one bucket+prefix (delete is
#     needed only for retention pruning) - the backup key must NOT be able to read
#     user uploads or export archives;
#   - the app pods must NOT mount this Secret; only the backup CronJob does.
#
# Create it out-of-band (kubectl / Sealed Secrets / External Secrets / SOPS), e.g.:
#
#   kubectl -n critter create secret generic critter-backup-secrets \
#     --from-literal=BACKUP_S3_ENDPOINT="https://s3.example.com" \
#     --from-literal=BACKUP_S3_REGION="us-east-1" \
#     --from-literal=BACKUP_S3_BUCKET="critter-backups" \
#     --from-literal=BACKUP_S3_PREFIX="db/" \
#     --from-literal=BACKUP_S3_PATH_STYLE="1" \
#     --from-literal=BACKUP_S3_ACCESS_KEY_ID="…" \
#     --from-literal=BACKUP_S3_SECRET_ACCESS_KEY="…" \
#     --from-literal=BACKUP_RETENTION_DAYS="14"
apiVersion: v1
kind: Secret
metadata:
  name: critter-backup-secrets
  namespace: critter
type: Opaque
stringData:
  # --- S3-compatible destination (a bucket of its own, not the app's) ---------
  BACKUP_S3_ENDPOINT: "https://s3.example.com"    # full URL incl. https://
  BACKUP_S3_REGION: "us-east-1"                   # filler for self-hosted S3, but required
  BACKUP_S3_BUCKET: "backups"                     # MUST differ from the export/upload buckets
  BACKUP_S3_PREFIX: "db/"                         # optional key prefix inside the bucket
  BACKUP_S3_PATH_STYLE: "1"                       # "1" for self-hosted S3 (MinIO/Ceph/Garage); "0"/"" for AWS

  # --- credentials scoped to the backup bucket only ---------------------------
  # A dedicated key pair with a write/list/delete-only policy on BACKUP_S3_BUCKET.
  # Never reuse the app's AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY here.
  BACKUP_S3_ACCESS_KEY_ID: "change-me"
  BACKUP_S3_SECRET_ACCESS_KEY: "change-me"

  # --- retention --------------------------------------------------------------
  BACKUP_RETENTION_DAYS: "14"                     # dumps older than this are pruned each run
