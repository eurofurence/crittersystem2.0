# Template only - DO NOT commit real secrets. Create the real Secret with e.g.:
#
#   kubectl -n critter create secret generic critter-secrets \
#     --from-literal=APP_SECRET="$(php -r 'echo bin2hex(random_bytes(16));')" \
#     --from-literal=DATABASE_URL="postgresql://app:STRONG@critter-db:5432/app?serverVersion=16&charset=utf8" \
#     --from-literal=INSTALL_PASSWORD="" \
#     --from-literal=POSTGRES_PASSWORD="STRONG" \
#     --from-literal=MERCURE_JWT_SECRET="$(php -r 'echo bin2hex(random_bytes(24));')" \
#     --from-literal=MERCURE_SUBSCRIBER_JWT_SECRET="$(php -r 'echo bin2hex(random_bytes(24));')"
#
# (or manage it with Sealed Secrets / External Secrets / SOPS in GitOps).
apiVersion: v1
kind: Secret
metadata:
  name: critter-secrets
  namespace: critter
type: Opaque
stringData:
  APP_SECRET: "change-me-32-hex-chars"
  DATABASE_URL: "postgresql://app:change-me@critter-db:5432/app?serverVersion=16&charset=utf8"
  # Empty disables the web installer (manage setup via `kubectl exec`).
  INSTALL_PASSWORD: ""
  POSTGRES_PASSWORD: "change-me"
  # Export archives (audit legal packages, GDPR data exports). MUST be s3:// on Kubernetes: the pod
  # that builds an archive and the pod that serves its download share no filesystem, so a local://
  # DSN loses the archive. Credentials come from AWS_* env or an instance role, never the DSN.
  EXPORT_STORAGE_DSN: "s3://critter-exports?region=eu-central-1&prefix=exports"
  UPLOAD_STORAGE_DSN: "s3://critter-uploads?region=eu-central-1&prefix=uploads"
  # Live updates. Both must be at least 32 characters (HMAC-SHA256 minimum key length) and must
  # differ from each other: the subscriber secret signs tokens that are handed to every browser, so
  # if it ever leaks it must not also be able to publish to the hub.
  MERCURE_JWT_SECRET: "change-me-at-least-32-characters-long"
  MERCURE_SUBSCRIBER_JWT_SECRET: "change-me-too-and-differently-32ch"
  # Reached over the cluster network to publish; browsers subscribe through the app's own origin,
  # which the nginx sidecar proxies to the hub.
  MERCURE_URL: "http://critter-mercure/.well-known/mercure"
  MERCURE_PUBLIC_URL: "/.well-known/mercure"
