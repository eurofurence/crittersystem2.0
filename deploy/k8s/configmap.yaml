# nginx config for the in-pod sidecar. Unlike the Compose config, php-fpm is
# reached over the pod's shared loopback (127.0.0.1), not a service name.
apiVersion: v1
kind: ConfigMap
metadata:
  name: critter-nginx
  namespace: critter
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /app/public;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        # Mercure hub, served on the app's own origin so the subscriber token can be a
        # SameSite=Strict cookie rather than a cross-site one. Which topics that token actually
        # authorizes is decided by the application and signed; nothing here grants anything.
        location /.well-known/mercure {
            proxy_pass http://critter-mercure;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Server-sent events: the response never ends, so buffering it would deliver nothing
            # until the connection closed, and a read timeout would tear down a healthy idle stream.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            chunked_transfer_encoding off;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            internal;

            # nginx buffers the whole response header block in a single buffer of this size and
            # answers 502 if it does not fit. The default is one page (4 KB), which a signed-in
            # page's Set-Cookie headers can exceed. Keep this in step with docker/nginx/default.conf.
            fastcgi_buffer_size 64k;
            fastcgi_buffers 16 32k;
            fastcgi_busy_buffers_size 64k;
        }

        location ~* ^/assets/ {
            try_files $uri /index.php$is_args$args;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~ \.php$ { return 404; }
        client_max_body_size 16m;
    }
