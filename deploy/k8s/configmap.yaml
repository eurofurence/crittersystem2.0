# nginx config for the in-pod sidecar. Unlike the Compose config, php-fpm is
# reached over the pod's shared loopback (127.0.0.1), not a service name.
apiVersion: v1
kind: ConfigMap
metadata:
  name: critter-nginx
  namespace: critter
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /app/public;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            internal;
        }

        location ~* ^/assets/ {
            try_files $uri /index.php$is_args$args;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~ \.php$ { return 404; }
        client_max_body_size 16m;
    }
