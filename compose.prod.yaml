# Production-shaped stack: PostgreSQL + PHP-FPM app + nginx.
#
#   cp docker/.env.prod.example docker/.env.prod   # then edit the secrets
#   docker compose -f compose.prod.yaml up -d --build
#
# The app container migrates the database on startup (advisory-locked, retried),
# so the stack is safe to bring up in one command and to restart freely.
services:
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    env_file: [docker/.env.prod]
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    restart: unless-stopped

  app:
    build:
      context: .
      target: prod
    env_file: [docker/.env.prod]
    environment:
      APP_ENV: prod
      RUN_MIGRATIONS_ON_START: "1"
      PUBLIC_SYNC_DIR: /var/www/public
    volumes:
      - public_data:/var/www/public
      # Export archives. The worker builds them and this container serves the download, so the two
      # MUST see the same storage - with a `local://` EXPORT_STORAGE_DSN that means this shared
      # volume. Point the DSN at S3 instead and the volume becomes unnecessary.
      - export_data:/app/var/exports
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  # Messenger worker. WITHOUT THIS CONTAINER the audit trail, GDPR data exports and all
  # outbound email are queued in `messenger_messages` and never processed - the application
  # keeps working and silently records nothing. It is not optional.
  #
  # --time-limit/--memory-limit recycle the long-lived PHP process; `restart: unless-stopped`
  # brings it straight back. The queue is durable (PostgreSQL), so a restart resumes exactly
  # where it left off and nothing is lost.
  worker:
    build:
      context: .
      target: prod
    env_file: [docker/.env.prod]
    environment:
      APP_ENV: prod
      RUN_MIGRATIONS_ON_START: "0"   # the app container owns migrations
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=192M", "-v"]
    volumes:
      - export_data:/app/var/exports   # see the app service: the download is served from another container
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  # Retention. Export archives are short-lived bundles of personal data: the GDPR archive is a full
  # copy of one user's data and its download window is 24 hours, the audit package is a signed legal
  # artifact kept for 30 days. Without this container both simply accumulate in storage forever.
  # Hours run on their own cadence: a shift ending writes nothing, so the cached totals only move
  # when this sweep looks for shifts that have finished since each row was last calculated.
  hours:
    build:
      context: .
      target: prod
    env_file: [docker/.env.prod]
    environment:
      APP_ENV: prod
      RUN_MIGRATIONS_ON_START: "0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          php bin/console app:hours:recalculate
          sleep 300
        done
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  purge:
    build:
      context: .
      target: prod
    env_file: [docker/.env.prod]
    environment:
      APP_ENV: prod
      RUN_MIGRATIONS_ON_START: "0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          php bin/console app:gdpr:purge-exports
          php bin/console app:audit:purge-exports
          sleep 3600
        done
    volumes:
      - export_data:/app/var/exports
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  # Mercure hub: the live-update transport. Not published to the host - the browser reaches it
  # through nginx at /.well-known/mercure on the app's own origin, which is what lets the subscriber
  # token be a SameSite=Strict cookie.
  #
  # NEVER scale this to more than one replica. The open-source hub does not cluster, so a second
  # instance serves browsers that never receive what the app published to the first, and nothing
  # reports an error.
  mercure:
    image: dunglas/mercure:v0.16
    env_file: [docker/.env.prod]
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_data:/app/public:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - app
      - mercure
    restart: unless-stopped

volumes:
  database_data:
  public_data:
  export_data:
