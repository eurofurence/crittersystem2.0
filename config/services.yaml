# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $projectDir: '%kernel.project_dir%'
            string $environment: '%kernel.environment%'
            # Password that gates the /admin/install wizard. Empty = installer disabled.
            string $installPassword: '%env(INSTALL_PASSWORD)%'
            # Symmetric key for encrypting secrets at rest (SSO secret, Telegram key, certificate).
            string $encryptionKey: '%env(APP_ENCRYPTION_KEY)%'
            # Pepper for hashing banned identities (one-way, never reversible).
            string $banPepper: '%env(APP_SECRET)%'
            # Comma-separated hosts allowed for embedded location maps (frame-src CSP).
            string $allowedDomains: '%env(LOCATION_EMBED_ALLOWED_DOMAINS)%'
            # Shared service token the Telegram bot presents on /api/bot. Empty = the
            # bot surface refuses every request.
            string $botApiToken: '%env(BOT_API_TOKEN)%'
            # SSO / OIDC connection - configured via environment (Infisical).
            bool $ssoEnabled: '%env(bool:SSO_ENABLED)%'
            string $ssoDiscoveryUrl: '%env(SSO_DISCOVERY_URL)%'
            string $ssoClientId: '%env(SSO_CLIENT_ID)%'
            string $ssoClientSecret: '%env(SSO_CLIENT_SECRET)%'
            string $ssoAuthorizationUrl: '%env(SSO_AUTHORIZATION_URL)%'
            string $ssoTokenUrl: '%env(SSO_TOKEN_URL)%'
            string $ssoUserinfoUrl: '%env(SSO_USERINFO_URL)%'
            string $ssoScopes: '%env(SSO_SCOPES)%'
            string $ssoProviderLabel: '%env(SSO_PROVIDER_LABEL)%'
            # UI locales the app builds catalogs for and the LocaleSubscriber accepts.
            array $enabledLocales: '%kernel.enabled_locales%'

    # src/Dev/ (the UI kit pages) is excluded here and registered below for non-prod only.
    # This exclusion is what keeps the kit out of production: `routing.controllers` derives
    # routes from controller *services*, not from a directory scan, so a controller that is
    # not a service in prod has no route in prod.
    App\:
        resource: '../src/'
        exclude:
            - '../src/Dev/'

    # Primed onto the encrypted DBAL type in Kernel::boot(), so it must be
    # fetchable from the container.
    App\Service\SecretCipher:
        public: true

    # Uploads filesystem: one pluggable backend (local folder in dev, S3 in prod)
    # chosen by the UPLOAD_STORAGE_DSN env var. App\Storage\FileStorage is the
    # only thing application code touches.
    app.uploads_filesystem:
        class: League\Flysystem\Filesystem
        factory: ['@App\Storage\FileStorageFactory', 'create']
        arguments: ['%env(UPLOAD_STORAGE_DSN)%']

    App\Storage\FileStorage:
        arguments:
            $uploads: '@app.uploads_filesystem'

    # Exports filesystem: audit legal packages and GDPR data exports. Separate from uploads so it can
    # have its own bucket and lifecycle policy. It must be reachable by every process - the web
    # request that serves a download and the messenger worker that writes the archive are different
    # containers, and in Kubernetes they do not share a disk at all.
    app.exports_filesystem:
        class: League\Flysystem\Filesystem
        factory: ['@App\Storage\FileStorageFactory', 'create']
        arguments: ['%env(EXPORT_STORAGE_DSN)%']

    App\Storage\ExportStorage:
        arguments:
            $exports: '@app.exports_filesystem'

    # The Doctrine Migrations bundle registers the DependencyFactory privately
    # under "doctrine.migrations.dependency_factory"; alias it so our install
    # services can autowire the native migration status API.
    Doctrine\Migrations\DependencyFactory: '@doctrine.migrations.dependency_factory'

# The UI kit pages exist only outside production. Each one also carries #[IsGranted('global:admin')],
# so a non-admin cannot reach them in dev/test either.
when@dev:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        App\Dev\:
            resource: '../src/Dev/'

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        App\Dev\:
            resource: '../src/Dev/'
