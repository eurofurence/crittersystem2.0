security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Custom provider: resolves a login by username OR email (App\Security\UserProvider)
    providers:
        app_user_provider:
            id: App\Security\UserProvider

    # Core role ladder. ROLE_ADMIN has full, unrestricted access, so it
    # reaches every role-gated route; ROLE_SUBADMIN is one step below, etc. This
    # only covers ROLE_* attribute checks - fine-grained permissions go through
    # App\Security\PrivilegeVoter, which also treats ROLE_ADMIN as a super-role.
    role_hierarchy:
        ROLE_ADMIN: [ROLE_SUBADMIN, ROLE_STAFF, ROLE_USER]
        ROLE_SUBADMIN: [ROLE_STAFF, ROLE_USER]
        ROLE_STAFF: [ROLE_USER]

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api_bot:
            # Telegram bot surface. Must stay ABOVE the ^/api firewall, which would
            # otherwise match first and authenticate the bearer token as a user API
            # key. Here the token identifies the *bot*; the acting volunteer comes
            # from the X-Acting-User header (App\Security\Bot\ActingUserResolver).
            pattern: ^/api/bot
            stateless: true
            custom_authenticators:
                - App\Security\Bot\BotTokenAuthenticator
        api:
            # Stateless API-key firewall (Bearer / X-API-Key / ?key=).
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\ApiKeyAuthenticator
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\BannedUserChecker
            custom_authenticators:
                - App\Security\LoginFormAuthenticator
            entry_point: App\Security\LoginFormAuthenticator
            logout:
                path: app_logout
                target: app_login

    # Note: Only the *first* matching rule is applied
    access_control:
        # Install wizard + health probe must be reachable before any user exists,
        # so they bypass the firewall. The wizard is protected by INSTALL_PASSWORD.
        - { path: ^/admin/install, roles: PUBLIC_ACCESS }
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/unavailable$, roles: PUBLIC_ACCESS } # "system restricted" notice for access-mode-gated users
        - { path: ^/$, roles: PUBLIC_ACCESS }     # site root redirects (guest -> login, user -> dashboard)
        # Must precede ^/api: the bot surface is never public. Without this the
        # PUBLIC_ACCESS rule below would match it, and a request carrying no
        # Authorization header would never reach the authenticator at all.
        - { path: ^/api/bot, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api, roles: PUBLIC_ACCESS }   # authorization is enforced per endpoint by the API controllers
        - { path: ^/digital-id/verify, roles: PUBLIC_ACCESS } # scannable digital ID - no login required
        - { path: ^/unsubscribe/, roles: PUBLIC_ACCESS } # one-click email unsubscribe - no login required
        - { path: ^/invite/, roles: PUBLIC_ACCESS } # account invitation acceptance - signs the user in
        - { path: ^/erase/, roles: PUBLIC_ACCESS } # erasure confirmation from emailed link
        - { path: ^/appeal, roles: PUBLIC_ACCESS } # ban appeal ("The Ledger-Keeper")
        - { path: ^/telegram/dummy, roles: PUBLIC_ACCESS } # dev/test dummy bot callback (404 in prod)
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
