framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Audit events are written off the request path by the async worker.
            App\Audit\AuditRecord: async
            # GDPR data-portability exports are built in the background.
            App\Gdpr\GenerateDataExport: async

when@test:
    framework:
        messenger:
            transports:
                sync: 'sync://'
            routing:
                # Handle these inline under test so results are immediately
                # observable without running a worker.
                App\Audit\AuditRecord: sync
                App\Gdpr\GenerateDataExport: sync
