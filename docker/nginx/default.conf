# nginx front for the PHP-FPM app container. Standard Symfony layout: all
# requests funnel through public/index.php. `fastcgi_pass app:9000` targets the
# app service (Compose) or the php-fpm sidecar (k8s) on the shared network.
server {
    listen 80;
    server_name _;
    root /app/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # The PHP file is internal — do not let clients call other *.php directly.
        internal;
    }

    # Long-cache the content-hashed AssetMapper output.
    location ~* ^/assets/ {
        try_files $uri /index.php$is_args$args;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 16m;
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
