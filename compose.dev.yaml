# Containerised DEV stack: edit code on the host, run it (and the full test /
# lint toolchain) in containers. Source is bind-mounted, so changes are live.
#
#   docker compose -f compose.dev.yaml up -d --build
#
# The source tree is bind-mounted, so the container writes into your working copy. It therefore runs
# as YOUR uid/gid rather than the image's www-data (uid 82) - otherwise files the container creates
# under var/ are owned by 82 and your host user cannot write or delete them (and vice versa), which
# breaks running the test suite on the host.
#
# The default below is the maintainer's uid. If yours differs (`id -u`), pass your own - the values are
# only ever the identity the container runs as, so a wrong one costs you nothing but the same
# permission clash:
#
#   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose -f compose.dev.yaml up -d
#
# Recreating `app` gives it a new address, and nginx resolves its upstream once at startup, so restart
# `web` too or it will serve 502 against the container that is gone.
#   docker compose -f compose.dev.yaml exec app composer install
#   docker compose -f compose.dev.yaml exec app php bin/phpunit
#   docker compose -f compose.dev.yaml exec app php bin/console lint:twig templates
#   open http://localhost:8000   (Mailpit UI on http://localhost:8025)
services:
  # -----------------------------------------------------------------------------------------------------------------
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}

    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 10
      start_period: 30s

    ports:
      - "5432:5432"

    volumes:
      - database_data_dev:/var/lib/postgresql/data:rw

    networks:
      - critter-dev-net

  # -----------------------------------------------------------------------------------------------------------------
  app:
    build:
      context: .
      target: dev

    user: "${HOST_UID:-1001}:${HOST_GID:-1001}"

    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      # Auto-migrate the dev database on start for a turnkey environment.
      RUN_MIGRATIONS_ON_START: "1"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8"
      MAILER_DSN: "smtp://mailer:1025"
      # Set to enable the web installer; unset to manage setup from the console.
      INSTALL_PASSWORD: "${INSTALL_PASSWORD:-devinstall}"
      # Publish over the internal network; the browser subscribes through nginx on the app's origin.
      MERCURE_URL: "http://mercure/.well-known/mercure"
      MERCURE_PUBLIC_URL: "/.well-known/mercure"

    volumes:
      # Live source mount. The named volume keeps container-built vendor/ from
      # being shadowed when the host has none (delete it to use host vendor).
      - .:/app

    depends_on:
      database:
        condition: service_healthy

    networks:
      - critter-dev-net

  # -----------------------------------------------------------------------------------------------------------------
  # Messenger worker. Without it, audit events, GDPR exports and mail queue up in
  # `messenger_messages` and are never written - the app appears to work and records nothing.
  # Dev runs it too, so the development environment matches production's delivery path.
  worker:
    build:
      context: .
      target: dev

    user: "${HOST_UID:-1001}:${HOST_GID:-1001}"

    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      RUN_MIGRATIONS_ON_START: "0"   # the app container owns migrations
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8"
      MAILER_DSN: "smtp://mailer:1025"

    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=192M", "-v"]

    volumes:
      - .:/app

    depends_on:
      database:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - critter-dev-net

  # -----------------------------------------------------------------------------------------------------------------
  web:
    image: nginx:1.27-alpine

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/app:ro

    ports:
      - "${HTTP_PORT:-8000}:80"

    depends_on:
      - app

    networks:
      - critter-dev-net

  # -----------------------------------------------------------------------------------------------------------------
  # Mercure hub: the live-update transport (notifications, chat, help calls, shift capacity).
  #
  # Not published to the host. The browser reaches it through nginx at /.well-known/mercure on the
  # app's own origin, which is what lets the subscriber token travel as a SameSite=Strict cookie.
  #
  # ONE replica, always. The open-source hub does not cluster: a second one would serve browsers that
  # never receive what the app published to the first, silently.
  mercure:
    image: dunglas/mercure:v0.16

    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}"
      MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_SUBSCRIBER_JWT_SECRET:-!ChangeThisMercureSubscriberJWTSecretKey!}"
      # anonymous off: every subscriber must present a token, so an unauthenticated connection
      # receives nothing at all rather than every public update.
      # subscriptions off: the subscription API would let one subscriber enumerate the others.
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8000 http://127.0.0.1:8000

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - critter-dev-net

  # -----------------------------------------------------------------------------------------------------------------
  mailer:
    image: axllent/mailpit

    # Bind published ports to the loopback interface only - never 0.0.0.0.
    ports:
      - "127.0.0.1:8925:8025"

    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db

    volumes:
      - mailpit_data:/data

    networks:
      - critter-dev-net

  # -----------------------------------------------------------------------------------------------------------------
  # Local OpenID Connect provider for SSO development
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: ["start-dev", "--http-port=8080"]

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"

    ports:
      - "8980:8080"

    volumes:
      - keycloak_data:/opt/keycloak/data

    networks:
      - critter-dev-net

# -----------------------------------------------------------------------------------------------------------------
volumes:
  database_data_dev:
  mailpit_data:
  keycloak_data:

# -----------------------------------------------------------------------------------------------------------------
networks:
  critter-dev-net:
